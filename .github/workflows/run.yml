name: run

on:
  workflow_dispatch:
  push:
  schedule:
    - cron: 10 16 * * *

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: ''

      - run: npm ci
      - run: npm run main
    env:
      GLADOS: ${{ secrets.GLADOS }}
      NOTIFY: ${{ secrets.NOTIFY }}
